name: Release

# 依 Conventional Commits（feat: / fix: …）自動開「發版 PR」：
# 合併後會更新 Cargo.toml 版號、寫入 CHANGELOG.md，並建立 GitHub Release。
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
