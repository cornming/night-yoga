[package]
name = "night-yoga"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Storage", "SpeechSynthesis", "SpeechSynthesisUtterance", "AudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "OscillatorNode", "GainNode", "BiquadFilterNode", "AudioBuffer", "AudioBufferSourceNode", "BaseAudioContext", "AudioScheduledSourceNode", "Navigator", "Location", "WakeLock", "WakeLockSentinel", "WakeLockType", "ServiceWorkerContainer", "HtmlElement", "HtmlMediaElement", "HtmlAudioElement", "BiquadFilterType", "OscillatorType", "ConvolverNode", "StereoPannerNode"] }
